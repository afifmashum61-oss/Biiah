<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="75%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orb1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="75%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Islamic Star Pattern -->
    <pattern id="islamic-stars" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-width="1" opacity="0.07">
        <rect x="0" y="0" width="120" height="120"/>
        <polygon points="60,10 75,45 110,60 75,75 60,110 45,75 10,60 45,45"/>
        <polygon points="60,25 70,50 95,60 70,70 60,95 50,70 25,60 50,50" transform="rotate(45 60 60)"/>
        <circle cx="60" cy="60" r="48"/>
      </g>
    </pattern>
  </defs>

  <!-- Base Rectangle with Rich Forest Gradient -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Glowing Light Orbs -->
  <circle cx="500" cy="300" r="600" fill="url(#orb1)"/>
  <circle cx="1400" cy="700" r="700" fill="url(#orb2)"/>

  <!-- Islamic Geometric Overlay -->
  <rect width="1920" height="1080" fill="url(#islamic-stars)"/>

  <!-- Forest Mountain Silhouettes at Bottom -->
  <g opacity="0.3">
    <!-- Background Distant Mountains -->
    <path d="M 0,1080 L 0,700 Q 300,550 600,720 T 1200,680 T 1920,750 L 1920,1080 Z" fill="#064e3b"/>
    <!-- Midground Forest Hills -->
    <path d="M 0,1080 L 0,820 Q 400,690 800,850 T 1600,780 T 1920,840 L 1920,1080 Z" fill="#022c22"/>
  </g>

  <!-- Pine Trees & Foliage Silhouettes -->
  <g fill="#022c22" opacity="0.4">
    <!-- Left Tree Group -->
    <polygon points="80,1080 130,850 180,1080"/>
    <polygon points="95,950 130,780 165,950"/>
    <polygon points="105,860 130,720 155,860"/>

    <polygon points="200,1080 260,780 320,1080"/>
    <polygon points="220,910 260,700 300,910"/>

    <!-- Right Tree Group -->
    <polygon points="1650,1080 1710,800 1770,1080"/>
    <polygon points="1670,920 1710,720 1750,920"/>

    <polygon points="1780,1080 1830,860 1880,1080"/>
    <polygon points="1795,950 1830,790 1865,950"/>
  </g>

  <!-- Large Arabic Calligraphy Watermark in Center Background -->
  <text x="960" y="580" font-family="'Amiri', serif" font-weight="700" font-size="160" fill="#ffffff" opacity="0.05" text-anchor="middle" letter-spacing="10">
    مشكلتنا: الحفاظ على البيئة
  </text>
</svg>
