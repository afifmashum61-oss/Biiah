<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Path for curved text: MADRASAH TSANAWIYAH DARUSSALAM -->
    <path id="text-curve-top" d="M 105,260 A 145,145 0 1,1 395,260" fill="none"/>
    <!-- Path for curved text: NGESONG - SENGON -->
    <path id="text-curve-bottom" d="M 125,275 A 145,145 0 0,0 375,275" fill="none"/>
    
    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Outer Black Border Polygon -->
    <polygon points="250,10 480,180 400,520 100,520 20,180" fill="#1b1c1e" stroke="#1b1c1e" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Outer White Gap Polygon -->
    <polygon points="250,20 470,186 393,512 107,512 30,186" fill="#ffffff"/>

    <!-- Main Green Shield -->
    <polygon points="250,28 462,192 387,504 113,504 38,192" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

    <!-- Central White Circle -->
    <circle cx="250" cy="270" r="150" fill="#ffffff" stroke="#1b1c1e" stroke-width="5"/>

    <!-- Center Yellow Inner Circle -->
    <circle cx="250" cy="270" r="86" fill="#facc15" stroke="#1b1c1e" stroke-width="4"/>

    <!-- Globe Lattice Lines at Bottom of Yellow Circle -->
    <path d="M 170,300 Q 250,345 330,300" fill="none" stroke="#7c2d12" stroke-width="4"/>
    <path d="M 180,320 Q 250,360 320,320" fill="#9a3412" stroke="#7c2d12" stroke-width="3"/>
    <line x1="250" y1="270" x2="250" y2="356" stroke="#7c2d12" stroke-width="3"/>
    <line x1="210" y1="280" x2="210" y2="340" stroke="#7c2d12" stroke-width="2.5"/>
    <line x1="290" y1="280" x2="290" y2="340" stroke="#7c2d12" stroke-width="2.5"/>

    <!-- Golden Wings (Left & Right) -->
    <!-- Left Wing -->
    <path d="M 210,270 Q 180,240 190,200 Q 210,230 225,250 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <path d="M 200,270 Q 170,235 180,195 Q 200,225 215,250 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <!-- Right Wing -->
    <path d="M 290,270 Q 320,240 310,200 Q 290,230 275,250 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <path d="M 300,270 Q 330,235 320,195 Q 300,225 285,250 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>

    <!-- Twin Pen / Towers in Center -->
    <path d="M 238,280 L 238,205 L 246,190 L 246,280 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <path d="M 254,280 L 254,205 L 262,190 L 262,280 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>

    <!-- Star at Top of Yellow Circle -->
    <polygon points="250,172 254,183 266,183 256,190 260,201 250,194 240,201 244,190 234,183 246,183" fill="#ca8a04" stroke="#78350f" stroke-width="1.5"/>

    <!-- Curved Text: MADRASAH TSANAWIYAH DARUSSALAM -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#1b1c1e" letter-spacing="1">
      <textPath href="#text-curve-top" startOffset="50%" text-anchor="middle">
        MADRASAH TSANAWIYAH DARUSSALAM
      </textPath>
    </text>

    <!-- Curved Text: NGESONG - SENGON -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#1b1c1e" letter-spacing="1.5">
      <textPath href="#text-curve-bottom" startOffset="50%" text-anchor="middle">
        NGESONG - SENGON
      </textPath>
    </text>

    <!-- Bottom Green Shield Text: JOMBANG -->
    <text x="250" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="3" stroke="#15803d" stroke-width="1">
      JOMBANG
    </text>
  </g>
</svg>
